<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Operations</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      background: white;
      padding: 30px;
      margin: 40px auto;
      width: 700px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .matrix-wrapper {
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
    }

    .matrix input {
      width: 60px;
      height: 40px;
      font-size: 18px;
      text-align: center;
    }

    button {
      width: 260px;
      padding: 15px;
      margin: 10px;
      font-size: 16px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      background: #7ec7f2;
    }

    button:hover {
      background: #5ab1e6;
    }

    .output {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .cell {
      background: #eaeaea;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Matrix Operations</h2>

    <!-- INPUT MATRICES -->
    <div class="matrix-wrapper">
      <div class="matrix">
        <input class="a" type="number">
        <input class="a" type="number">
        <input class="a" type="number">
        <input class="a" type="number">
        <input class="a" type="number">
        <input class="a" type="number">
        <input class="a" type="number">
        <input class="a" type="number">
        <input class="a" type="number">
      </div>

      <div class="matrix">
        <input class="b" type="number">
        <input class="b" type="number">
        <input class="b" type="number">
        <input class="b" type="number">
        <input class="b" type="number">
        <input class="b" type="number">
        <input class="b" type="number">
        <input class="b" type="number">
        <input class="b" type="number">
      </div>
    </div>

    <!-- BUTTONS -->
    <button onclick="add()">ADDITION OF TWO MATRICES</button>
    <button onclick="multiply()">MULTIPLICATION OF TWO MATRICES</button>

    <h3>Output</h3>
    <div id="output" class="output"></div>

  </div>

  <script>
    function getMatrix(className) {
      const inputs = document.querySelectorAll("." + className);
      let matrix = [];
      let index = 0;

      for (let i = 0; i < 3; i++) {
        let row = [];
        for (let j = 0; j < 3; j++) {
          row.push(Number(inputs[index].value) || 0);
          index++;
        }
        matrix.push(row);
      }
      return matrix;
    }

    function display(matrix) {
      const output = document.getElementById("output");
      output.innerHTML = "";

      matrix.forEach(row => {
        row.forEach(value => {
          const div = document.createElement("div");
          div.className = "cell";
          div.textContent = value;
          output.appendChild(div);
        });
      });
    }

    function add() {
      const A = getMatrix("a");
      const B = getMatrix("b");
      let result = [];

      for (let i = 0; i < 3; i++) {
        let row = [];
        for (let j = 0; j < 3; j++) {
          row.push(A[i][j] + B[i][j]);
        }
        result.push(row);
      }
      display(result);
    }

    function multiply() {
      const A = getMatrix("a");
      const B = getMatrix("b");
      let result = [];

      for (let i = 0; i < 3; i++) {
        let row = [];
        for (let j = 0; j < 3; j++) {
          let sum = 0;
          for (let k = 0; k < 3; k++) {
            sum += A[i][k] * B[k][j];
          }
          row.push(sum);
        }
        result.push(row);
      }
      display(result);
    }
  </script>

</body>
</html>
